<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>把自己的部分做完｜離線校稿本</title>
    <style>
      :root {
        --paper: #f4efe5;
        --paper-deep: #e9e0d1;
        --panel: #fbf8f1;
        --ink: #29251f;
        --muted: #756c60;
        --line: #d7cdbc;
        --accent: #9b5538;
        --accent-soft: #f0ded3;
        --note: #b58a42;
        --reading-size: 19px;
        --serif: "Songti TC", "Noto Serif TC", "PMingLiU", Georgia, serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--serif); }
      button, textarea, select { font: inherit; }
      button { color: inherit; }
      button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      ::selection { color: var(--ink); background: #dfc999; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      .reader-toolbar {
        position: fixed; inset: 0 0 auto; z-index: 40; height: 68px; display: flex; align-items: center;
        gap: 18px; padding: 0 24px; color: var(--ink); background: rgba(244, 239, 229, .94);
        border-bottom: 1px solid var(--line); backdrop-filter: blur(12px);
      }
      .brand { min-width: 260px; display: flex; align-items: baseline; gap: 10px; }
      .brand strong { font-size: 17px; letter-spacing: .05em; }
      .brand span { color: var(--muted); font-family: var(--sans); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .progress-track { flex: 1; height: 2px; overflow: hidden; background: var(--line); }
      .progress-bar { display: block; width: 0; height: 100%; background: var(--accent); transition: width .2s ease; }
      .toolbar-actions { display: flex; align-items: center; gap: 8px; }
      .tool-button, .text-button, .panel-button, .import-label {
        min-height: 36px; border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 7px 11px;
        font-family: var(--sans); font-size: 13px; border-radius: 2px;
      }
      .tool-button:hover, .text-button:hover, .panel-button:hover, .import-label:hover { border-color: var(--accent); color: var(--accent); }
      .text-button { min-width: 36px; padding-inline: 8px; }
      .note-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 4px; padding: 0 5px; border-radius: 999px; color: #fff; background: var(--accent); font-size: 11px; }

      .mobile-jump { display: none; position: fixed; z-index: 35; top: 68px; left: 0; right: 0; padding: 9px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
      .mobile-jump select { width: 100%; padding: 8px 32px 8px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

      .reader-layout { display: grid; grid-template-columns: 230px minmax(0, 760px) 340px; gap: 42px; max-width: 1450px; margin: 0 auto; padding: 112px 28px 100px; }
      .toc { position: sticky; top: 94px; align-self: start; max-height: calc(100vh - 118px); overflow: auto; padding-right: 8px; }
      .toc-label { margin: 0 0 14px; color: var(--accent); font-family: var(--sans); font-size: 10px; letter-spacing: .18em; }
      .toc-item { width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: 7px; padding: 7px 4px; border: 0; border-left: 2px solid transparent; color: var(--muted); background: transparent; text-align: left; cursor: pointer; font-size: 12px; line-height: 1.5; }
      .toc-item span { color: #aaa092; font-family: var(--sans); font-size: 10px; padding-top: 2px; }
      .toc-item:hover, .toc-item.is-active { color: var(--ink); border-left-color: var(--accent); }

      .manuscript { min-width: 0; }
      .manuscript-section { position: relative; padding: 28px 34px 76px; margin-bottom: 36px; background: rgba(251, 248, 241, .64); border: 1px solid rgba(215, 205, 188, .72); }
      .section-index { color: #a69b8c; font-family: var(--sans); font-size: 10px; letter-spacing: .15em; }
      .chapter-body > h1 { max-width: 620px; margin: 26px 0 44px; font-size: clamp(31px, 4.6vw, 48px); font-weight: 600; line-height: 1.28; letter-spacing: .01em; text-wrap: balance; }
      .chapter-body > h2 { margin: 54px 0 23px; padding-top: 12px; font-size: 24px; font-weight: 600; line-height: 1.5; }
      .chapter-body > h3 { margin: 38px 0 17px; font-size: 19px; font-weight: 600; line-height: 1.55; }
      .chapter-body > p, .chapter-body > blockquote, .chapter-body > ul, .chapter-body > ol {
        position: relative; margin: 0 0 1.05em; font-size: var(--reading-size); font-weight: 400; line-height: 2.05;
        letter-spacing: .012em; text-wrap: pretty;
      }
      .chapter-body > blockquote { margin-left: 0; padding: 8px 0 8px 22px; border-left: 2px solid var(--accent); color: #574d42; }
      .chapter-body > [data-note-block] { transition: background-color .18s ease, box-shadow .18s ease; }
      .chapter-body > [data-note-block]:hover { background: rgba(255, 255, 255, .34); }
      .chapter-body > [data-note-block].has-note { box-shadow: -4px 0 0 var(--note); }
      .chapter-body > [data-note-block].note-flash { animation: flash 1.3s ease; }
      @keyframes flash { 0%, 100% { background: transparent; } 35% { background: #f0dfb7; } }
      .block-note-button {
        position: absolute; top: .28em; left: -31px; width: 24px; height: 24px; padding: 0; opacity: 0; border: 1px solid var(--line);
        border-radius: 50%; color: var(--accent); background: var(--panel); cursor: pointer; font-family: var(--sans); font-size: 15px; line-height: 1;
        transition: opacity .15s ease, border-color .15s ease;
      }
      [data-note-block]:hover > .block-note-button, .block-note-button:focus-visible, [data-note-block].has-note > .block-note-button { opacity: 1; }

      .notes-panel { position: sticky; top: 92px; align-self: start; height: calc(100vh - 116px); display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
      .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 17px; border-bottom: 1px solid var(--line); }
      .panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
      .panel-close { display: none; border: 0; background: transparent; cursor: pointer; font-family: var(--sans); font-size: 22px; }
      .panel-tools { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .panel-button, .import-label { min-height: 32px; padding: 5px 9px; font-size: 11px; }
      .panel-button:disabled { opacity: .42; cursor: not-allowed; }
      .local-note { margin: 0; padding: 0 15px 13px; color: var(--muted); font-family: var(--sans); font-size: 11px; line-height: 1.55; border-bottom: 1px solid var(--line); }
      .composer { padding: 15px; background: #f7f0e6; border-bottom: 1px solid var(--line); }
      .composer[hidden] { display: none; }
      .composer-label { display: block; margin-bottom: 6px; color: var(--accent); font-family: var(--sans); font-size: 10px; letter-spacing: .12em; }
      .quote-preview { max-height: 92px; overflow: auto; margin: 0 0 10px; padding-left: 10px; border-left: 2px solid var(--note); color: #665b4e; font-size: 12px; line-height: 1.65; }
      .composer textarea { width: 100%; min-height: 112px; resize: vertical; padding: 10px; border: 1px solid var(--line); color: var(--ink); background: #fffdf8; font-family: var(--serif); font-size: 14px; line-height: 1.7; }
      .field-error { min-height: 18px; margin: 5px 0 0; color: #a33f31; font-family: var(--sans); font-size: 11px; }
      .composer-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 7px; }
      .primary { color: #fff; border-color: var(--accent); background: var(--accent); }
      .primary:hover { color: #fff; background: #82442d; }

      .notes-list { flex: 1; overflow: auto; padding: 14px; }
      .empty-state { padding: 28px 9px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.75; }
      .note-card { margin-bottom: 12px; padding: 12px; border: 1px solid var(--line); background: #fffdf8; }
      .note-chapter { margin-bottom: 7px; color: var(--accent); font-family: var(--sans); font-size: 10px; letter-spacing: .05em; }
      .note-quote { width: 100%; margin: 0 0 8px; padding: 0 0 0 9px; border: 0; border-left: 2px solid var(--note); color: #6a6054; background: transparent; text-align: left; cursor: pointer; font-size: 11px; line-height: 1.55; }
      .note-text { margin: 0 0 10px; white-space: pre-wrap; font-size: 13px; line-height: 1.7; }
      .note-actions { display: flex; gap: 10px; }
      .note-actions button { padding: 0; border: 0; border-bottom: 1px solid transparent; color: var(--muted); background: transparent; cursor: pointer; font-family: var(--sans); font-size: 11px; }
      .note-actions button:hover { color: var(--accent); border-bottom-color: currentColor; }

      .selection-action { position: fixed; z-index: 80; display: none; padding: 9px 13px; border: 0; color: #fff; background: var(--ink); box-shadow: 0 8px 30px rgba(41, 37, 31, .25); cursor: pointer; font-family: var(--sans); font-size: 12px; }
      .selection-action.is-visible { display: block; }
      .toast { position: fixed; z-index: 100; left: 50%; bottom: 24px; transform: translate(-50%, 18px); max-width: min(420px, calc(100vw - 32px)); padding: 10px 15px; opacity: 0; pointer-events: none; color: #fff; background: var(--ink); font-family: var(--sans); font-size: 12px; transition: .2s ease; }
      .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

      .resume-button { display: none; }
      .resume-button.is-visible { display: inline-block; }

      @media (max-width: 1100px) {
        .brand { min-width: 0; }
        .brand span, .progress-track { display: none; }
        .reader-toolbar { justify-content: space-between; }
        .mobile-jump { display: block; }
        .reader-layout { display: block; max-width: 820px; padding-top: 142px; }
        .toc { display: none; }
        .notes-panel { position: fixed; z-index: 70; top: 0; right: 0; bottom: 0; width: min(390px, 94vw); height: 100vh; transform: translateX(105%); transition: transform .22s ease; box-shadow: -24px 0 60px rgba(41, 37, 31, .18); }
        .reader-root.panel-open::after { content: ""; position: fixed; z-index: 65; inset: 0; background: rgba(41, 37, 31, .32); }
        .reader-root.panel-open .notes-panel { transform: translateX(0); }
        .panel-close { display: block; }
      }

      @media (max-width: 650px) {
        .reader-toolbar { height: 60px; padding: 0 13px; gap: 8px; }
        .brand strong { font-size: 14px; }
        .mobile-jump { top: 60px; }
        .resume-button, .text-label { display: none !important; }
        .tool-button, .text-button { min-height: 34px; padding: 5px 8px; font-size: 11px; }
        .reader-layout { padding: 126px 10px 70px; }
        .manuscript-section { margin-bottom: 18px; padding: 23px 23px 54px 31px; }
        .chapter-body > h1 { margin: 20px 0 34px; font-size: 31px; }
        .chapter-body > h2 { margin-top: 44px; font-size: 21px; }
        .chapter-body > p, .chapter-body > blockquote, .chapter-body > ul, .chapter-body > ol { line-height: 1.95; }
        .block-note-button { left: -28px; opacity: .6; }
        .notes-panel { top: auto; left: 0; width: 100%; height: min(82vh, 720px); transform: translateY(105%); border-width: 1px 0 0; box-shadow: 0 -20px 60px rgba(41, 37, 31, .2); }
        .reader-root.panel-open .notes-panel { transform: translateY(0); }
        .selection-action { left: 16px !important; right: 16px; bottom: 14px; top: auto !important; width: calc(100vw - 32px); }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="reader-root" id="reader-root">
      <header class="reader-toolbar">
        <div class="brand"><strong>把自己的部分做完</strong><span id="offline-status">offline proof · {{SECTION_COUNT}} sections</span></div>
        <div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div>
        <div class="toolbar-actions">
          <button class="tool-button resume-button" id="resume-button" type="button">回到上次閱讀</button>
          <span class="text-label sr-only">調整字級</span>
          <button class="text-button" id="font-smaller" type="button" aria-label="縮小內文字級">A−</button>
          <button class="text-button" id="font-larger" type="button" aria-label="放大內文字級">A＋</button>
          <button class="tool-button" id="notes-toggle" type="button" aria-controls="notes-panel" aria-expanded="false">註解 <span class="note-count" data-note-count>0</span></button>
        </div>
      </header>

      <div class="mobile-jump">
        <label class="sr-only" for="chapter-select">跳到章節</label>
        <select id="chapter-select"><!-- READER_OPTIONS --></select>
      </div>

      <div class="reader-layout">
        <nav class="toc" aria-label="章節目錄">
          <p class="toc-label">閱讀目錄</p>
          <!-- READER_TOC -->
        </nav>

        <main class="manuscript" id="manuscript"><!-- READER_CONTENT --></main>

        <aside class="notes-panel" id="notes-panel" aria-label="我的註解" aria-hidden="false">
          <div class="panel-head">
            <h2>我的註解 <span class="note-count" data-note-count>0</span></h2>
            <button class="panel-close" id="panel-close" type="button" aria-label="關閉註解面板">×</button>
          </div>
          <div class="panel-tools">
            <button class="panel-button primary" id="copy-chatgpt" type="button">複製給 ChatGPT</button>
            <button class="panel-button" id="export-markdown" type="button">匯出 Markdown</button>
            <button class="panel-button" id="export-json" type="button">備份 JSON</button>
            <label class="import-label" for="import-json">匯入 JSON</label>
            <input class="sr-only" id="import-json" type="file" accept="application/json,.json" />
          </div>
          <p class="local-note">註解會一直留在這個瀏覽器，可以分很多次慢慢讀。交給網頁版 ChatGPT 時使用「複製給 ChatGPT」；要直接交回 Codex，可匯出 Markdown。</p>
          <form class="composer" id="composer" hidden novalidate>
            <span class="composer-label">引用原文</span>
            <p class="quote-preview" id="quote-preview"></p>
            <label class="composer-label" for="note-input">修改建議</label>
            <textarea id="note-input" placeholder="哪裡需要調整？可以直接寫你想要的方向…" required></textarea>
            <p class="field-error" id="field-error" aria-live="polite"></p>
            <div class="composer-actions">
              <button class="panel-button" id="cancel-note" type="button">取消</button>
              <button class="panel-button primary" type="submit">儲存註解</button>
            </div>
          </form>
          <div class="notes-list" id="notes-list">
            <div class="empty-state" id="empty-state">選取一段文字後按「加上註解」<br />也可以按每段左側的 ＋</div>
          </div>
        </aside>
      </div>

      <button class="selection-action" id="selection-action" type="button">＋ 加上註解</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script>
      (() => {
        const NOTES_KEY = "rui-xuan-manuscript-notes-v1";
        const PROGRESS_KEY = "rui-xuan-manuscript-progress-v1";
        const PREFS_KEY = "rui-xuan-manuscript-prefs-v1";
        const root = document.getElementById("reader-root");
        const manuscript = document.getElementById("manuscript");
        const panel = document.getElementById("notes-panel");
        const notesToggle = document.getElementById("notes-toggle");
        const panelClose = document.getElementById("panel-close");
        const composer = document.getElementById("composer");
        const noteInput = document.getElementById("note-input");
        const quotePreview = document.getElementById("quote-preview");
        const fieldError = document.getElementById("field-error");
        const notesList = document.getElementById("notes-list");
        const emptyState = document.getElementById("empty-state");
        const selectionAction = document.getElementById("selection-action");
        const toast = document.getElementById("toast");
        const chapterSelect = document.getElementById("chapter-select");
        const progressBar = document.getElementById("progress-bar");
        const resumeButton = document.getElementById("resume-button");
        const blocks = new Map();
        let notes = loadNotes();
        let draft = null;
        let editingId = null;
        let toastTimer = 0;
        let pendingDelete = null;
        let activeSectionId = null;

        function loadNotes() {
          try {
            const parsed = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]");
            return Array.isArray(parsed) ? parsed.filter(isNote) : [];
          } catch {
            return [];
          }
        }

        function isNote(value) {
          return value && typeof value.id === "string" && typeof value.blockId === "string" &&
            typeof value.sectionKey === "string" && typeof value.sourceFile === "string" &&
            typeof value.chapterTitle === "string" && typeof value.quote === "string" &&
            Number.isInteger(value.sourceLineStart) && Number.isInteger(value.sourceLineEnd) &&
            typeof value.note === "string" && typeof value.createdAt === "string" &&
            typeof value.updatedAt === "string";
        }

        function persistNotes(next) {
          try {
            localStorage.setItem(NOTES_KEY, JSON.stringify(next));
            notes = next;
            renderNotes();
            return true;
          } catch {
            showToast("無法寫入瀏覽器儲存空間，請先匯出現有註解");
            return false;
          }
        }

        function showToast(message) {
          window.clearTimeout(toastTimer);
          toast.textContent = message;
          toast.classList.add("is-visible");
          toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2800);
        }

        function setPanel(open) {
          root.classList.toggle("panel-open", open);
          notesToggle.setAttribute("aria-expanded", String(open));
          panel.setAttribute("aria-hidden", String(!open && window.innerWidth <= 1100));
          if (open && window.innerWidth <= 1100) panelClose.focus();
        }

        function blockContext(block, quote) {
          const section = block.closest(".manuscript-section");
          return {
            blockId: block.dataset.noteBlock,
            sectionKey: section.dataset.sectionKey,
            sourceFile: section.dataset.sourceFile,
            chapterTitle: section.dataset.sectionTitle,
            quote: quote || block.dataset.noteText,
            sourceLineStart: Number(block.dataset.sourceLineStart),
            sourceLineEnd: Number(block.dataset.sourceLineEnd),
          };
        }

        function openComposer(context, note) {
          draft = context;
          editingId = note ? note.id : null;
          quotePreview.textContent = context.quote;
          noteInput.value = note ? note.note : "";
          fieldError.textContent = "";
          composer.hidden = false;
          setPanel(true);
          selectionAction.classList.remove("is-visible");
          window.setTimeout(() => noteInput.focus(), 0);
        }

        function closeComposer() {
          composer.hidden = true;
          fieldError.textContent = "";
          draft = null;
          editingId = null;
        }

        function truncate(text, length) {
          const clean = text.replace(/\s+/g, " ").trim();
          return clean.length > length ? `${clean.slice(0, length)}…` : clean;
        }

        function renderNotes() {
          notesList.querySelectorAll(".note-card").forEach((node) => node.remove());
          const sorted = [...notes].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
          emptyState.hidden = sorted.length > 0;
          document.querySelectorAll("[data-note-count]").forEach((node) => { node.textContent = String(sorted.length); });
          document.querySelectorAll("[data-note-block]").forEach((node) => node.classList.remove("has-note"));
          sorted.forEach((note) => blocks.get(note.blockId)?.classList.add("has-note"));

          for (const note of sorted) {
            const card = document.createElement("article");
            card.className = "note-card";

            const chapter = document.createElement("div");
            chapter.className = "note-chapter";
            chapter.textContent = `${note.chapterTitle} · ${note.sourceFile}:${note.sourceLineStart}-${note.sourceLineEnd}`;

            const quote = document.createElement("button");
            quote.type = "button";
            quote.className = "note-quote";
            quote.textContent = truncate(note.quote, 130);
            quote.title = "回到原文";
            quote.addEventListener("click", () => jumpToNote(note));

            const text = document.createElement("p");
            text.className = "note-text";
            text.textContent = note.note;

            const actions = document.createElement("div");
            actions.className = "note-actions";
            const edit = document.createElement("button");
            edit.type = "button";
            edit.textContent = "編輯";
            edit.addEventListener("click", () => openComposer(note, note));
            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = pendingDelete === note.id ? "再按一次刪除" : "刪除";
            remove.addEventListener("click", () => requestDelete(note.id));
            actions.append(edit, remove);
            card.append(chapter, quote, text, actions);
            notesList.append(card);
          }

          const disabled = sorted.length === 0;
          document.getElementById("copy-chatgpt").disabled = disabled;
          document.getElementById("export-markdown").disabled = disabled;
          document.getElementById("export-json").disabled = disabled;
        }

        function requestDelete(id) {
          if (pendingDelete !== id) {
            pendingDelete = id;
            renderNotes();
            window.setTimeout(() => {
              if (pendingDelete === id) {
                pendingDelete = null;
                renderNotes();
              }
            }, 3200);
            return;
          }
          pendingDelete = null;
          if (persistNotes(notes.filter((note) => note.id !== id))) showToast("註解已刪除");
        }

        function jumpToNote(note) {
          const block = blocks.get(note.blockId);
          if (!block) {
            showToast("來源段落已變動，請依匯出內容中的引用原文重新定位");
            return;
          }
          setPanel(false);
          block.scrollIntoView({ behavior: "smooth", block: "center" });
          block.classList.remove("note-flash");
          window.setTimeout(() => block.classList.add("note-flash"), 50);
        }

        function currentSelectionContext() {
          const selection = window.getSelection();
          if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
          const anchor = selection.anchorNode?.nodeType === Node.TEXT_NODE ? selection.anchorNode.parentElement : selection.anchorNode;
          const focus = selection.focusNode?.nodeType === Node.TEXT_NODE ? selection.focusNode.parentElement : selection.focusNode;
          const startBlock = anchor?.closest?.("[data-note-block]");
          const endBlock = focus?.closest?.("[data-note-block]");
          const quote = selection.toString().replace(/\s+/g, " ").trim();
          if (!startBlock || startBlock !== endBlock || !quote) return null;
          return blockContext(startBlock, quote);
        }

        manuscript.querySelectorAll(".manuscript-section").forEach((section) => {
          const sectionKey = section.dataset.sectionKey;
          const lineRanges = JSON.parse(section.dataset.blockLines || "[]");
          section.querySelectorAll(".chapter-body > p, .chapter-body > blockquote, .chapter-body > ul, .chapter-body > ol, .chapter-body > h2, .chapter-body > h3").forEach((block, index) => {
            const range = lineRanges[index];
            if (!range) throw new Error(`無法對應來源行號：${sectionKey}:${index}`);
            const blockId = `${sectionKey}:L${range.start}-L${range.end}`;
            block.dataset.noteBlock = blockId;
            block.dataset.noteText = block.textContent.replace(/\s+/g, " ").trim();
            block.dataset.sourceLineStart = String(range.start);
            block.dataset.sourceLineEnd = String(range.end);
            blocks.set(blockId, block);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "block-note-button";
            button.setAttribute("aria-label", `替這段加註：${truncate(block.dataset.noteText, 42)}`);
            button.textContent = "+";
            button.addEventListener("click", () => {
              const selected = currentSelectionContext();
              openComposer(selected?.blockId === blockId ? selected : blockContext(block));
            });
            block.append(button);
          });
        });

        manuscript.addEventListener("pointerup", () => {
          window.setTimeout(() => {
            const context = currentSelectionContext();
            if (!context) {
              selectionAction.classList.remove("is-visible");
              return;
            }
            draft = context;
            const selection = window.getSelection();
            const rect = selection.getRangeAt(0).getBoundingClientRect();
            selectionAction.style.left = `${Math.max(12, Math.min(window.innerWidth - 150, rect.left + rect.width / 2 - 60))}px`;
            selectionAction.style.top = `${Math.max(78, rect.bottom + 10)}px`;
            selectionAction.classList.add("is-visible");
          }, 0);
        });

        selectionAction.addEventListener("click", () => {
          if (draft) openComposer(draft);
        });

        composer.addEventListener("submit", (event) => {
          event.preventDefault();
          const value = noteInput.value.trim();
          if (!value) {
            fieldError.textContent = "請先寫下修改建議";
            noteInput.focus();
            return;
          }
          if (!draft) return;
          const now = new Date().toISOString();
          const existing = editingId ? notes.find((note) => note.id === editingId) : null;
          const record = {
            id: existing?.id || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`),
            ...draft,
            note: value,
            createdAt: existing?.createdAt || now,
            updatedAt: now,
          };
          const next = existing ? notes.map((note) => note.id === existing.id ? record : note) : [...notes, record];
          if (persistNotes(next)) {
            closeComposer();
            window.getSelection()?.removeAllRanges();
            showToast(existing ? "註解已更新" : "註解已儲存");
          }
        });

        function download(name, content, type) {
          const blob = new Blob([content], { type });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = name;
          document.body.append(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }

        function exportPayload() {
          return {
            format: "rui-xuan-manuscript-notes",
            version: 1,
            manuscriptTitle: "把自己的部分做完",
            exportedAt: new Date().toISOString(),
            notes: [...notes].sort((a, b) => a.chapterTitle.localeCompare(b.chapterTitle, "zh-Hant")),
          };
        }

        function markdownExport(includeChatGptPrompt) {
          const payload = exportPayload();
          const groups = new Map();
          for (const note of payload.notes) {
            if (!groups.has(note.chapterTitle)) groups.set(note.chapterTitle, []);
            groups.get(note.chapterTitle).push(note);
          }
          const lines = [];
          if (includeChatGptPrompt) {
            lines.push(
              "請把以下人工閱讀註解整理成一份可直接交給 Codex 執行的 Markdown 修改單。不要遺失或改寫 note_id、source_file、source_lines、locator 與 quote。每則註解請補一個 proposed_revision，內容是建議修改方向或替代文字；資訊不足時標記 needs_author_decision，不要自行發明作者經歷。輸出只要 Markdown。",
              "",
              "---",
              "",
            );
          }
          lines.push("# 《把自己的部分做完》修改建議", "", `匯出時間：${payload.exportedAt}`, "", `共 ${notes.length} 則註解`, "");
          for (const [chapter, chapterNotes] of groups) {
            lines.push(`## ${chapter}`, "");
            chapterNotes.forEach((note, index) => {
              lines.push(
                `### 建議 ${index + 1}`,
                "",
                `- note_id: \`${note.id}\``,
                `- source_file: \`${note.sourceFile}\``,
                `- source_lines: \`L${note.sourceLineStart}-L${note.sourceLineEnd}\``,
                `- locator: \`${note.blockId}\``,
                "",
                "#### quote",
                "",
                ...note.quote.split("\n").map((line) => `> ${line}`),
                "",
                "#### suggestion",
                "",
                note.note,
                "",
              );
            });
          }
          return lines.join("\n");
        }

        document.getElementById("export-json").addEventListener("click", () => {
          download("把自己的部分做完-註解.json", JSON.stringify(exportPayload(), null, 2), "application/json;charset=utf-8");
          showToast("JSON 備份已下載");
        });

        document.getElementById("export-markdown").addEventListener("click", () => {
          download("把自己的部分做完-修改建議.md", markdownExport(false), "text/markdown;charset=utf-8");
          showToast("Markdown 修改建議已下載");
        });

        document.getElementById("copy-chatgpt").addEventListener("click", async () => {
          const content = markdownExport(true);
          try {
            await navigator.clipboard.writeText(content);
            showToast("已複製，可直接貼到網頁版 ChatGPT");
          } catch {
            download("把自己的部分做完-給ChatGPT的修改建議.md", content, "text/markdown;charset=utf-8");
            showToast("瀏覽器未允許複製，已改為下載 Markdown");
          }
        });

        document.getElementById("import-json").addEventListener("change", async (event) => {
          const input = event.currentTarget;
          const file = input.files?.[0];
          if (!file) return;
          try {
            const payload = JSON.parse(await file.text());
            if (payload?.format !== "rui-xuan-manuscript-notes" || payload.version !== 1 || !Array.isArray(payload.notes) || !payload.notes.every(isNote)) {
              throw new Error("invalid");
            }
            const merged = new Map(notes.map((note) => [note.id, note]));
            payload.notes.forEach((note) => merged.set(note.id, note));
            if (persistNotes([...merged.values()])) showToast(`已匯入 ${payload.notes.length} 則註解`);
          } catch {
            showToast("無法匯入：請選擇由本閱讀器匯出的 JSON 檔");
          } finally {
            input.value = "";
          }
        });

        document.querySelectorAll(".toc-item").forEach((button) => {
          button.addEventListener("click", () => document.getElementById(button.dataset.target)?.scrollIntoView({ behavior: "smooth" }));
        });
        chapterSelect.addEventListener("change", () => document.getElementById(chapterSelect.value)?.scrollIntoView({ behavior: "smooth" }));

        const sections = [...document.querySelectorAll(".manuscript-section")];
        const observer = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          activeSectionId = visible.target.id;
          document.querySelectorAll(".toc-item").forEach((button) => button.classList.toggle("is-active", button.dataset.target === activeSectionId));
          chapterSelect.value = activeSectionId;
          try { localStorage.setItem(PROGRESS_KEY, activeSectionId); } catch {}
        }, { rootMargin: "-18% 0px -68% 0px", threshold: 0 });
        sections.forEach((section) => observer.observe(section));

        function updateProgress() {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          const value = max > 0 ? Math.min(100, Math.max(0, window.scrollY / max * 100)) : 0;
          progressBar.style.width = `${value}%`;
        }
        window.addEventListener("scroll", updateProgress, { passive: true });
        updateProgress();

        let savedSection = null;
        try { savedSection = localStorage.getItem(PROGRESS_KEY); } catch {}
        if (savedSection && document.getElementById(savedSection)) resumeButton.classList.add("is-visible");
        resumeButton.addEventListener("click", () => {
          document.getElementById(savedSection)?.scrollIntoView({ behavior: "smooth" });
          resumeButton.classList.remove("is-visible");
        });

        let readingSize = 19;
        try {
          const prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
          if (Number.isFinite(prefs.readingSize)) readingSize = Math.min(23, Math.max(17, prefs.readingSize));
        } catch {}
        function applyReadingSize() {
          root.style.setProperty("--reading-size", `${readingSize}px`);
          try { localStorage.setItem(PREFS_KEY, JSON.stringify({ readingSize })); } catch {}
        }
        document.getElementById("font-smaller").addEventListener("click", () => { readingSize = Math.max(17, readingSize - 1); applyReadingSize(); });
        document.getElementById("font-larger").addEventListener("click", () => { readingSize = Math.min(23, readingSize + 1); applyReadingSize(); });
        applyReadingSize();

        notesToggle.addEventListener("click", () => setPanel(!root.classList.contains("panel-open")));
        panelClose.addEventListener("click", () => { setPanel(false); notesToggle.focus(); });
        document.getElementById("cancel-note").addEventListener("click", closeComposer);
        root.addEventListener("click", (event) => {
          if (window.innerWidth <= 1100 && root.classList.contains("panel-open") && event.target === root) setPanel(false);
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            selectionAction.classList.remove("is-visible");
            if (root.classList.contains("panel-open")) {
              setPanel(false);
              notesToggle.focus();
            }
          }
        });

        renderNotes();

        if ("serviceWorker" in navigator && location.protocol !== "file:") {
          navigator.serviceWorker.register("./sw.js").then(() => {
            document.getElementById("offline-status").textContent = "已可離線閱讀 · {{SECTION_COUNT}} sections";
          }).catch(() => {
            document.getElementById("offline-status").textContent = "目前需保持連線 · {{SECTION_COUNT}} sections";
          });
        }
      })();
    </script>
  </body>
</html>
